name: MLOps CI/CD

# Déclenchement :
# - à chaque push/PR touchant la partie ML (lint + tests, rapides et systématiques)
# - manuellement (workflow_dispatch), pour un ré-entraînement à la demande
# - de façon planifiée (cron hebdomadaire), pour ré-entraîner sur les features
#   les plus récentes et surveiller la dérive des données
on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/mlops-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "ml/**"
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # tous les lundis 06:00 UTC

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ---------------------------------------------------------------------
  # 1. Lint + tests unitaires/smoke — sur chaque push/PR touchant ml/
  # ---------------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Installer les dépendances
        run: pip install -r ml/requirements.txt

      - name: Lint (ruff)
        run: ruff check ml/ --exclude ml/models

      - name: Tests (pytest, données synthétiques de repli)
        run: pytest ml/tests/ -v
        env:
          # Pas de données Kaggle réelles en CI : common.py génère un jeu de
          # données synthétique de même schéma (voir ml/common.py).
          MLFLOW_TRACKING_URI: "sqlite:///${{ github.workspace }}/mlflow_ci.db"

  # ---------------------------------------------------------------------
  # 2. Build & publication de l'image Docker du service d'inférence
  #    (uniquement sur push vers main, après succès des tests)
  # ---------------------------------------------------------------------
  build-serving-image:
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build image ml/serving
        run: docker build -f ml/serving/Dockerfile -t hm-retail-ml-serving:${{ github.sha }} ml/

      # Publication vers un registre (GHCR, Docker Hub...) : à activer une
      # fois le registre cible choisi, avec les secrets correspondants.
      # - name: Push vers GHCR
      #   run: |
      #     echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      #     docker tag hm-retail-ml-serving:${{ github.sha }} ghcr.io/${{ github.repository }}/ml-serving:${{ github.sha }}
      #     docker push ghcr.io/${{ github.repository }}/ml-serving:${{ github.sha }}

  # ---------------------------------------------------------------------
  # 3. Ré-entraînement planifié/manuel + monitoring de dérive
  #    Suppose un remote DVC (DagsHub), un MLflow tracking server et une
  #    instance PostgreSQL (contenant customers_features_train, alimentée par
  #    le pipeline Spark) accessibles depuis le runner, via des secrets
  #    (voir ml/MLOPS_GUIDE.md §2 et §7). Un runner GitHub-hosted classique ne
  #    peut PAS atteindre un docker-compose lancé en local sur un laptop : ce
  #    job suppose soit un runner self-hosted sur le même réseau que la stack,
  #    soit une instance PostgreSQL/MLflow exposée publiquement (staging/prod).
  # ---------------------------------------------------------------------
  scheduled-retrain:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ml/requirements.txt

      - name: Installer les dépendances
        run: pip install -r ml/requirements.txt

      - name: Récupérer les CSV bruts versionnés (DVC, optionnel)
        run: dvc pull
        env:
          DAGSHUB_USER: ${{ secrets.DAGSHUB_USER }}
          DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
        continue-on-error: true # tant que le remote DVC réel n'est pas configuré (secrets absents)

      - name: Rapport de dérive (Evidently, lit customers_features_train)
        run: python ml/monitoring/drift_report.py --output ml/monitoring/reports/drift_report.html
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Ré-entraîner et enregistrer les modèles (MLflow Model Registry)
        run: |
          python ml/training/train_classification.py --register
          python ml/training/train_regression.py --register
          python ml/training/train_clustering.py --register
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Publier le rapport de dérive
        uses: actions/upload-artifact@v6
        with:
          name: drift-report
          path: ml/monitoring/reports/drift_report.html