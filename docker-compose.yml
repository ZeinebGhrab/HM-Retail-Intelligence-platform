version: "3.9"

services:
  # ============================================================
  # ZOOKEEPER
  # ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: shop-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - shop_data_net

  # ============================================================
  # KAFKA
  # ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.3

    container_name: shop-kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - shop_data_net

  kafka-producer-api:
    build:
      context: ./kafka
    container_name: shop-producer-api
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - ./data/raw/daily:/data/daily
    env_file:
      - .env
    networks:
      - shop_data_net

  # ============================================================
  # KAFKA TOPIC INITIALIZATION
  # ============================================================

  kafka-init:
    image: confluentinc/cp-kafka:7.5.3

    container_name: shop-kafka-init

    restart: "no"

    depends_on:
      - kafka

    command:
      - bash
      - -c
      - |
        echo "Waiting for Kafka broker..."

        until kafka-topics \
          --bootstrap-server kafka:29092 \
          --list >/dev/null 2>&1
        do
          echo "Kafka not ready, waiting..."
          sleep 5
        done

        echo "Kafka is ready"

        kafka-topics \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic transactions.raw \
          --partitions 3 \
          --replication-factor 1

        echo "Topic transactions.raw created"

    networks:
      - shop_data_net
  # ============================================================
  # POSTGRESQL
  # ============================================================

  postgres:
    image: postgres:15-alpine

    container_name: shop-postgres

    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - shop_data_net

  # Adminer : interface web légère pour administrer et visualiser la base de données via un navigateur
  adminer:
    image: adminer:latest
    container_name: shop-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - shop_data_net
  grafana:
    image: grafana/grafana:latest
    container_name: shop-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=hm_admin
      # Embarquement en iframe dans frontend/ — désactivé par défaut chez
      # Grafana (X-Frame-Options). Accès anonyme en lecture seule (Viewer)
      # pour éviter un prompt de login à l'intérieur de l'iframe : ces
      # dashboards sont déjà en aggregate-only (voir grafana/*.json, aucune
      # variable de template pour un client précis), pas de donnée
      # sensible par client exposée ici.
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    networks:
      - shop_data_net
  # ============================================================
  # SPARK MASTER
  # ============================================================

  spark-master:
    build:
      context: ./spark
    restart: unless-stopped
    container_name: shop-spark-master

    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      SPARK_MASTER_HOST: spark-master

      SPARK_MASTER_PORT: 7077

      SPARK_MASTER_WEBUI_PORT: 8080

    env_file:
      - .env

    ports:
      - "${SPARK_MASTER_PORT}:7077"

      - "${SPARK_MASTER_WEBUI_PORT}:8080"

    volumes:
      - ./data:/opt/spark/work-dir/data
      - ./spark:/opt/spark/work-dir/spark

      # - ./spark/jobs:/opt/spark/work-dir/jobs

      # - ./spark/utils:/opt/spark/work-dir/utils

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - shop_data_net

  # ============================================================
  # SPARK WORKER
  # ============================================================

  spark-worker:
    build:
      context: ./spark

    container_name: shop-spark-worker

    hostname: spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - .env
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_MEMORY: 6G

      SPARK_WORKER_CORES: 6

    volumes:
      - ./data:/opt/spark/work-dir/data

      - ./spark:/opt/spark/work-dir/spark
      # - ./.env:/opt/spark/work-dir/.env

    networks:
      - shop_data_net
  # ============================================================
  # spark-streaming-job
  # ============================================================

  # spark-streaming-job:
