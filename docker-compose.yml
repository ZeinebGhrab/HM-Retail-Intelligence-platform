version: "3.9"

services:

# ============================================================
# ZOOKEEPER
# ============================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.3
    container_name: shop-zookeeper
    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - shop_data_net

# ============================================================
# KAFKA
# ============================================================

  kafka:
    image: confluentinc/cp-kafka:7.5.3

    container_name: shop-kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "${KAFKA_PORT}:9092"

    environment:

      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - shop_data_net

# ============================================================
# POSTGRESQL
# ============================================================

  postgres:

    image: postgres:15-alpine

    container_name: shop-postgres

    restart: unless-stopped

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:

      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - shop_data_net

  # Adminer : interface web légère pour administrer et visualiser la base de données via un navigateur
  adminer:
    image: adminer:latest
    container_name: shop-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    networks:
      - shop_data_net

# ============================================================
# SPARK MASTER
# ============================================================

  spark-master:

    build:
      context: ./spark

    container_name: shop-spark-master

    hostname: spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:

      SPARK_MASTER_HOST: spark-master

      SPARK_MASTER_PORT: 7077

      SPARK_MASTER_WEBUI_PORT: 8080
      
    env_file:
      - .env

    ports:

      - "${SPARK_MASTER_PORT}:7077"

      - "${SPARK_MASTER_WEBUI_PORT}:8080"

    volumes:

      - ./data:/opt/spark/work-dir/data

      - ./spark/jobs:/opt/spark/work-dir/jobs

      - ./spark/utils:/opt/spark/work-dir/utils

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - shop_data_net

# ============================================================
# SPARK WORKER
# ============================================================

  spark-worker:

    build:
      context: ./spark

    container_name: shop-spark-worker

    hostname: spark-worker

    depends_on:
      - spark-master

    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077
    env_file:
      - .env
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077

      SPARK_WORKER_MEMORY: 2G

      SPARK_WORKER_CORES: 2

    volumes:

      - ./data:/opt/spark/work-dir/data

      - ./spark/jobs:/opt/spark/work-dir/jobs

      - ./spark/utils:/opt/spark/work-dir/utils
      # - ./.env:/opt/spark/work-dir/.env 

    networks:
      - shop_data_net

# ============================================================
# N8N
# ============================================================

  n8n:

    image: n8nio/n8n:latest

    container_name: shop-n8n

    restart: unless-stopped

    ports:

      - "${N8N_PORT}:5678"

    volumes:

      - n8n_data:/home/node/.n8n

    environment:

      N8N_HOST: 0.0.0.0

      N8N_PORT: 5678

      N8N_PROTOCOL: http

      GENERIC_TIMEZONE: Europe/Paris

    networks:
      - shop_data_net

# ============================================================
# OLLAMA
# ============================================================

  ollama:

    image: ollama/ollama

    container_name: shop-ollama

    restart: unless-stopped

    ports:

      - "${OLLAMA_PORT}:11434"

    volumes:

      - ollama_data:/root/.ollama

    networks:
      - shop_data_net

# ============================================================
# QDRANT
# ============================================================

  qdrant:

    image: qdrant/qdrant

    container_name: shop-qdrant

    restart: unless-stopped

    ports:

      - "${QDRANT_PORT}:6333"

    volumes:

      - qdrant_data:/qdrant/storage

    networks:
      - shop_data_net

volumes:

  postgres_data:

  n8n_data:

  ollama_data:

  qdrant_data:

networks:

  shop_data_net:

    driver: bridge


