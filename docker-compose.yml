  # # ============================================================

  #   spark-worker-batch:

  #     build:
  #       context: ./spark

  #     container_name: shop-spark-worker-batch

  #     hostname: spark-worker-batch

  #     depends_on:
  #       - spark-master

  #     command: >
  #       /opt/spark/bin/spark-class
  #       org.apache.spark.deploy.worker.Worker
  #       spark://spark-master:7077

  #     env_file:
  #       - .env

  #     environment:
  #       SPARK_MASTER_URL: spark://spark-master:7077
