  #     networks:
  #       - shop_data_net
  # ============================================================
  # SPARK STREAMING JOB
  # ============================================================

  spark-streaming-job:
    build:
      context: ./spark

    container_name: shop-spark-streaming

    restart: unless-stopped

    depends_on:
      - kafka
      - spark-master
      - spark-worker

    env_file:
      - .env

    command: >
      /opt/spark/bin/spark-submit
      --master spark://spark-master:7077
      --deploy-mode client
      --driver-memory 1g
      --executor-memory 1g
      --executor-cores 2
      --total-executor-cores 2
      /opt/spark/work-dir/spark/streaming_pipeline/jobs/streaming_job.py

    volumes:
      - ./data:/opt/spark/work-dir/data

      - ./spark:/opt/spark/work-dir/spark

      - streaming_checkpoint:/opt/spark/work-dir/checkpoint

    networks:
      - shop_data_net

  # streaming-api:
  #   build:
  #     context: ./spark
  #     dockerfile: streaming_pipeline/streaming_api.Dockerfile

  #   container_name: shop-streaming-api

  #   ports:
  #     - "8000:8000"

  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - shop_data_net
  # ============================================================
  # spark-job-trigger
  # ============================================================
  spark-job-trigger:
    build:
      context: ./spark
      dockerfile: job_trigger.Dockerfile
    image: hm-retail-job-trigger:latest
    container_name: shop-job-trigger
    restart: unless-stopped
    ports:
      - "8091:8091"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - shop_data_net
      # ============================================================
  # generator_api
  # ============================================================
  generator-api:
    build:
      context: ./data/raw/daily
      dockerfile: Dockerfile

    image: hm-retail-generator-api:latest
    container_name: shop-job-generator-api

    restart: unless-stopped

    ports:
      - "8089:8089"

    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      ARTICLES_CSV: /data/raw/articles.csv
      CUSTOMERS_CSV: /data/raw/customers.csv
      OUTPUT_DIR: /data/raw/daily

    networks:
      - shop_data_net

  # ============================================================
  # N8N
  # ============================================================

  n8n:
    image: n8nio/n8n:latest

    container_name: shop-n8n

    restart: unless-stopped

    ports:
      - "${N8N_PORT}:5678"

    volumes:
      - n8n_data:/home/node/.n8n

    environment:
      N8N_HOST: 0.0.0.0

      N8N_PORT: 5678

      N8N_PROTOCOL: http

      GENERIC_TIMEZONE: Europe/Paris

    networks:
      - shop_data_net

  # ============================================================
  # OLLAMA
  # ============================================================

  ollama:
    image: ollama/ollama

    container_name: shop-ollama

    restart: unless-stopped

    ports:
      - "${OLLAMA_PORT}:11434"

    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      # =2 (pas 1) : backend/app/ alterne qwen2.5:3b (chat) et
      # nomic-embed-text (embeddings, voir tools/semantic.py) DANS une même
      # requête. À 1, chaque bascule forçait un déchargement/rechargement
      # complet depuis le disque — mesuré en test réel le 2026-08-29 à un
      # seul appel /api/chat prenant 47s (contre <1s en benchmark), le
      # pipeline complet (2 appels chat + embeddings) dépassant largement la
      # minute. Les deux modèles tiennent ensemble en RAM sans problème
      # (~1.9 Go + 274 Mo, aucun GPU/VRAM en jeu ici).
      - OLLAMA_MAX_LOADED_MODELS=2
    dns:
      - 8.8.8.8
    # Décommente si une machine avec GPU NVIDIA (+ nvidia-container-toolkit)
    # est disponible. Bloqué par défaut : sans ce runtime installé, Docker
    # refuse de démarrer le conteneur ("could not select device driver
    # nvidia with capabilities: [[gpu]]") au lieu de replier sur le CPU.
    # Ollama tourne très bien en CPU pur (voir backend/benchmark/config.py,
    # profils CPU) sans ce bloc.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    networks:
      - shop_data_net

  # ============================================================
  # BENCHMARK LLM (sélection du modèle Ollama — voir backend/benchmark/)
  # ============================================================
  # Ne démarre PAS avec un simple `docker compose up` (profiles: benchmark).
  # Lancement explicite : docker compose --profile benchmark up --build benchmark
  # Ré-exécution : run_once.sh ne relance rien si results/benchmark_report.json
  # existe déjà — supprime ce fichier (ou tout backend/benchmark/results/) pour forcer.

  benchmark:
    build:
      context: ./backend/benchmark

    container_name: shop-benchmark

    restart: "no"

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434

    volumes:
      - ./backend/benchmark/results:/workspace/results

    # Décommente si tu as un GPU NVIDIA (sinon CPU par défaut, ça marche aussi)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    profiles: ["benchmark"]

    networks:
      - shop_data_net

  # ============================================================
  # QDRANT
  # ============================================================

  qdrant:
    image: qdrant/qdrant

    container_name: shop-qdrant

    restart: unless-stopped

    ports:
      - "${QDRANT_PORT}:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - shop_data_net

  # ============================================================
  # MLFLOW (tracking d'expériences + Model Registry)
  # ============================================================

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2

    container_name: shop-mlflow

    restart: unless-stopped

    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0
      --port 5000

    ports:
      - "${MLFLOW_PORT}:5000"

    volumes:
      - mlflow_data:/mlflow

    networks:
      - shop_data_net

  # ============================================================
  # ML SERVING (API d'inférence FastAPI — voir ml/serving/ et ml/MLOPS_GUIDE.md)
  # ============================================================

  ml-serving:
    build:
      context: ./ml
      dockerfile: serving/Dockerfile

    container_name: shop-ml-serving

    restart: unless-stopped

    depends_on:
      - mlflow
      - postgres

    ports:
      - "${ML_SERVING_PORT}:8500"

    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./ml/models:/opt/ml/models

    networks:
      - shop_data_net

  # ============================================================
  # CHATBOT APP (API RAG client-spécifique — voir backend/app/)
  # ============================================================

  chatbot-app:
    build:
      context: ./backend/app

    container_name: shop-chatbot-app

    restart: unless-stopped

    depends_on:
      - ollama
      - postgres
      - ml-serving

    ports:
      - "${CHATBOT_APP_PORT}:8600"

    environment:
      OLLAMA_HOST: http://ollama:11434

      ML_SERVING_URL: http://ml-serving:8500

      POSTGRES_HOST: postgres

      POSTGRES_PORT: 5432

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - shop_data_net

volumes:
  postgres_data:

  n8n_data:

  ollama_data:

  qdrant_data:

  mlflow_data:

  streaming_checkpoint:

  grafana_data:

networks:
  shop_data_net:
    driver: bridge
